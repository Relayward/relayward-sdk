syntax = "proto3";

package relayward.centerplugin.v1;

option go_package = "github.com/Relayward/relayward-sdk/centerplugin/v1;centerpluginv1";

service CenterPlugin {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Activate(ActivateRequest) returns (Activated);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc InvokeUI(InvokeUIRequest) returns (InvokeUIResponse);
  rpc RenderSubscription(RenderSubscriptionRequest) returns (RenderSubscriptionResponse);
  rpc ConsumeEvents(ConsumeEventsRequest) returns (EventsConsumed);
}

service PluginHost {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNodePluginConfiguration(GetNodePluginConfigurationRequest) returns (NodePluginConfiguration);
  rpc ConfigureNodePlugin(ConfigureNodePluginRequest) returns (NodePluginConfigured);
  rpc ReplaceServices(ReplaceServicesRequest) returns (ServicesReplaced);
  rpc PublishEvents(PublishEventsRequest) returns (EventsPublished);
}

message GetInfoRequest {}

message GetInfoResponse {
  string api_version = 1;
  string plugin_id = 2;
  string version = 3;
}

message ActivateRequest {
  repeated string permissions = 1;
}

message Activated {
  repeated string permissions = 1;
}

message GetStatusRequest {}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_STARTING = 1;
  HEALTH_HEALTHY = 2;
  HEALTH_UNHEALTHY = 3;
}

message GetStatusResponse {
  Health health = 1;
  string message = 2;
}

message InvokeUIRequest {
  string method = 1;
  bytes json = 2;
}

message InvokeUIResponse {
  bytes json = 1;
}

message ListNodesRequest {}

message Node {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  bool connected = 4;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message GetNodePluginConfigurationRequest {
  string node_id = 1;
}

message NodePluginConfiguration {
  uint64 generation = 1;
  string version = 2;
  string sha256 = 3;
  bytes json = 4;
}

message ConfigureNodePluginRequest {
  string node_id = 1;
  uint64 expected_generation = 2;
  bytes json = 3;
}

message NodePluginConfigured {
  uint64 generation = 1;
  string sha256 = 2;
}

message ReplaceServicesRequest {
  string node_id = 1;
  repeated PluginService services = 2;
}

message PluginService {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  repeated string capabilities = 4;
  string subscription_sha256 = 5;
}

message ServicesReplaced {
  uint32 service_count = 1;
}

message PublishEventsRequest {
  repeated PublishedEvent events = 1;
}

message PublishedEvent {
  string source_event_id = 1;
  string node_id = 2;
  string kind = 3;
  int64 observed_at_unix_nano = 4;
  bytes json = 5;
}

message EventsPublished {
  uint32 event_count = 1;
}

message RenderSubscriptionRequest {
  string authorization_id = 1;
  string node_id = 2;
  repeated SubscriptionServiceBinding services = 3;
}

message SubscriptionServiceBinding {
  string service_id = 1;
  string display_name = 2;
}

message RenderSubscriptionResponse {
  repeated SubscriptionServiceContribution services = 1;
}

message SubscriptionServiceContribution {
  string service_id = 1;
  string display_name = 2;
  repeated string uris = 3;
  repeated bytes mihomo_proxies_json = 4;
  repeated bytes sing_box_outbounds_json = 5;
}

message ConsumeEventsRequest {
  repeated StandardEvent events = 1;
}

message StandardEvent {
  uint64 cursor = 1;
  string event_id = 2;
  string node_id = 3;
  string kind = 4;
  int64 observed_at_unix_nano = 5;
  int64 received_at_unix_nano = 6;
  bytes json = 7;
}

message EventsConsumed {
  uint64 through_cursor = 1;
}
