name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/relayward-conformance ./cmd/relayward-conformance
      - run: ./scripts/build-contract-plugin.sh 0.1.0 /tmp/relayward-contract-plugin
      - run: /tmp/relayward-conformance plugin-release /tmp/relayward-contract-plugin
      - run: /tmp/relayward-conformance envelope fixtures/envelopes/system-hello.json
      - run: /tmp/relayward-conformance agent-register fixtures/agent/register-request.json
      - run: /tmp/relayward-conformance agent-envelope fixtures/agent/hello.json
      - run: /tmp/relayward-conformance agent-envelope fixtures/agent/command.json
      - run: /tmp/relayward-conformance agent-envelope fixtures/agent/command-result.json
      - run: /tmp/relayward-conformance agent-envelope fixtures/agent/command-result-ack.json
      - run: /tmp/relayward-conformance agent-event-batch fixtures/agent/event-batch.json
      - run: /tmp/relayward-conformance agent-event-ack fixtures/agent/event-batch-ack.json
      - run: /tmp/relayward-conformance center-plugin-info fixtures/center-plugin/info.json
      - run: /tmp/relayward-conformance center-plugin-activation fixtures/center-plugin/activation.json
      - run: /tmp/relayward-conformance center-plugin-status fixtures/center-plugin/status.json
      - run: /tmp/relayward-conformance center-plugin-ui fixtures/center-plugin/ui-request.json
      - run: /tmp/relayward-conformance center-plugin-nodes fixtures/center-plugin/nodes.json
      - run: shellcheck scripts/build-contract-plugin.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --pack-destination /tmp
